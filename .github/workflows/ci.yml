name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # @emnapi/runtime is pinned as a devDependency only so the Windows-generated
      # lockfile carries the entry npm ci demands on Linux (npm optional-deps quirk)
      - name: Install dependencies
        run: npm ci

      # convex/_generated is committed; regenerate to catch a stale checkin
      - name: Generate Convex types
        run: npx convex codegen --typecheck disable

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
